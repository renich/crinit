<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#151d38" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#a5b4fc" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.45" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2" />

  <!-- Geometric Grid Accent -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0 64 H1200 M0 128 H1200 M0 192 H1200 M0 256 H1200" />
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320" />
  </g>

  <!-- Geometric Crystal Icon -->
  <g transform="translate(100, 60)">
    <polygon points="100,10 170,70 145,170 55,170 30,70" fill="url(#crystalGrad)" stroke="url(#accent)" stroke-width="3" filter="url(#glow)" />
    <polygon points="100,10 100,90 30,70" fill="#ffffff" fill-opacity="0.25" />
    <polygon points="100,10 100,90 170,70" fill="#a5b4fc" fill-opacity="0.3" />
    <polygon points="30,70 100,90 55,170" fill="#818cf8" fill-opacity="0.4" />
    <polygon points="170,70 100,90 145,170" fill="#6366f1" fill-opacity="0.5" />
    <polygon points="55,170 100,90 145,170" fill="#4f46e5" fill-opacity="0.6" />
  </g>

  <!-- Typography -->
  <g transform="translate(340, 115)">
    <!-- Project Title -->
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      crinit
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="url(#accent)" letter-spacing="0.01em">
      Next-Generation Pluggable Project Scaffolding for Crystal
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 115)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="62.5" y="17" fill="#38bdf8" text-anchor="middle">Crystal 1.21+</text>

      <rect x="137" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="207" y="17" fill="#818cf8" text-anchor="middle">Zero-Dependency</text>

      <rect x="289" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="356.5" y="17" fill="#a78bfa" text-anchor="middle">Cross-Platform</text>

      <rect x="436" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="496" y="17" fill="#34d399" text-anchor="middle">MIT License</text>
    </g>
  </g>
</svg>
