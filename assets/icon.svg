<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />
  <g transform="translate(48, 48)">
    <polygon points="80,10 135,45 145,115 80,150 25,110 15,45" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    <polygon points="80,10 80,150 15,45" fill="#ffffff" fill-opacity="0.25" />
    <polygon points="80,10 80,150 135,45" fill="#38bdf8" fill-opacity="0.3" />
    <polygon points="15,45 80,150 25,110" fill="#6366f1" fill-opacity="0.4" />
    <polygon points="135,45 80,150 145,115" fill="#a855f7" fill-opacity="0.5" />
  </g>
</svg>
